<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Catato</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6b21a8 0%, #1d4ed8 100%);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .greeting {
      text-align: center;
      animation: fadeInUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .greeting h1 {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1.1;
      text-shadow: 0 4px 32px rgba(0, 0, 0, 0.25);
    }

    .greeting p {
      margin-top: 1rem;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      font-weight: 300;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="greeting">
    <h1>Hola Catato!</h1>
    <p>Bienvenido</p>
  </div>
</body>
</html>
